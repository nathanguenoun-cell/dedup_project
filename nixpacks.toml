# Force Nixpacks to provision Python 3 and run the stdlib server.
# Without this (and with no requirements.txt/main.py marker), Nixpacks may build
# an image with no `python3` on PATH → "python3: command not found" at start.

[phases.setup]
nixPkgs = ["python3"]

# Install the deck-generation deps (python-pptx, openpyxl). --break-system-packages
# lets pip write into the nix python since there's no managed venv here.
[phases.install]
cmds = ["python3 -m pip install --break-system-packages -r requirements.txt"]

[start]
cmd = "python3 server.py"
