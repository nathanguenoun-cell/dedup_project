# Provision Python 3 with the deck-generation deps baked in via Nix (the nix
# `python3` has no pip, so we don't pip-install — we hand it a python that
# already imports python-pptx + openpyxl). lxml/Pillow come in as deps.
[phases.setup]
nixPkgs = ["(python3.withPackages (ps: with ps; [ python-pptx openpyxl ]))"]

[start]
cmd = "python3 server.py"
